[package]
name = "gaius"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22"
crossterm = { version = "0.29", features = ["event-stream", "osc52"] }
fast_html2md = "0.0.63"
futures = "0.3"
genai = "0.6"
glob = "0.3"
pico-args = "0.5"
rand = "0.10"
ratatui = "0.30"
regex = "1"
reqwest = { version = "0.13", features = ["json", "form"] }
rmp-serde = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
similar = "3.2"
tokio = { version = "1", features = ["full"] }
toml = "1.1"
tui-markdown = "0.3"
url = "2.5"
uuid = { version = "1", features = ["v7"] }
walkdir = "2"
webbrowser = "1"
