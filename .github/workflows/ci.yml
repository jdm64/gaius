name: CI

on:
  push:
    branches-ignore: ["feature**"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: CI Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            binary: gaius-linux-x86_64
          - name: macos-aarch64
            os: macos-15
            target: aarch64-apple-darwin
            binary: gaius-macos-aarch64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli

      - name: Build release
        working-directory: cli
        run: |
          cargo clippy --release --target ${{ matrix.target }} -- -D warnings
          cargo build --release --target ${{ matrix.target }}
          cargo test --release --target ${{ matrix.target }}
          mv target/${{ matrix.target }}/release/gaius ${{ matrix.binary }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.binary }}
          path: cli/${{ matrix.binary }}
          retention-days: 3

  publish:
    name: Publish continuous release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          find artifacts -type f -name 'gaius-*' -exec cp {} release/ \;
          ls -la release/

      - name: Force update tag
        id: vars
        run: |
          SAFE_BRANCH=$(echo "${{ github.ref_name }}" | sed 's/[^a-zA-Z0-9_.-]/-/g')
          git tag -f continuous-$SAFE_BRANCH
          git push --force origin continuous-$SAFE_BRANCH
          echo "branch=$SAFE_BRANCH" >> "$GITHUB_OUTPUT"
          echo "tag=continuous-$SAFE_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Remove existing continuous release if present
        run: gh release delete "${{ steps.vars.outputs.tag }}" --yes --cleanup-tag || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish continuous build
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ${{ steps.vars.outputs.branch }} Continuous Build
          make_latest: false
          prerelease: true
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
