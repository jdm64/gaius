name: CI

on:
  push:
    branches: ["**"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: CI Build
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Cache cargo registry & build artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cli/target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-

      - name: Build release
        run: |
          cargo build --release
          cargo test --release
          cargo clippy --release
          mv target/release/gaius gaius-linux-x86_64
        working-directory: cli

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: gaius-linux-x86_64
          path: cli/gaius-linux-x86_64

      - name: Force update tag
        id: vars
        run: |
          SAFE_BRANCH=$(echo "${{ github.ref_name }}" | sed 's/[^a-zA-Z0-9_.-]/-/g')
          git tag -f continuous-$SAFE_BRANCH
          git push --force origin continuous-$SAFE_BRANCH
          echo "branch=$SAFE_BRANCH" >> "$GITHUB_OUTPUT"
          echo "tag=continuous-$SAFE_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Remove existing continuous release if present
        run: gh release delete "${{ steps.vars.outputs.tag }}" --yes --cleanup-tag || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to continuous build
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ${{ steps.vars.outputs.branch }} Continuous Build
          make_latest: false
          prerelease: true
          files: cli/gaius-linux-x86_64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
